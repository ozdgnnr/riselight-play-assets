<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riselight foreground service demo</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
  video { width: 100%; max-height: 80vh; background: #000; border-radius: 8px; }
</style>
</head>
<body>
<main>
  <h1>Riselight: foreground service demo</h1>
  <video controls playsinline preload="metadata" src="riselight-fgs-demo.mp4"></video>
  <p>The user starts a focus session ("Başla"), leaves the app, sees the ongoing notification with the elapsed time, and ends the session from the notification's "Bitir" (End) action. The service stops when the session ends.</p>
</main>
</body>
</html>
